[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stepbot"
version = "0.1.0"
description = "Compiler from simple YAML/JSON liquid-handling protocols to Opentrons Python API v2 files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Yani Guan" },
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = [
    "opentrons>=7.0,<9.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
stepbot = "stepbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
