[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stepbot"
version = "0.1.0"
description = "Compiler from simple YAML/JSON liquid-handling protocols to Opentrons Python API v2 files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Yani Guan" },
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = [
    "opentrons>=7.0,<9.0",
]
dev = [
    "mypy>=1.8",
    "pytest>=7.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
stepbot = "stepbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "opentrons",
    "opentrons.*",
    "opentrons_shared_data",
    "opentrons_shared_data.*",
    "yaml",
]
ignore_missing_imports = true
