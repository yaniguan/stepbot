name: CI

on:
  push:
  pull_request:

jobs:
  test-mock:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (base + dev)
        run: python -m pip install -e .[dev]
      - name: Run tests (built-in mock)
        run: pytest

  test-sim:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev + sim)
        run: python -m pip install -e .[dev,sim]
      - name: Run tests (with Opentrons simulator)
        run: pytest
